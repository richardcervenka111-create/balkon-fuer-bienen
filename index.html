const L={
 de:{h:"Balkon für Bienen",s:"20 Pflanzen, die in Bern auf dem Balkon Wildbienen, Hummeln und Schmetterlinge ernähren. Monat wählen: was jetzt blüht, was jetzt gesetzt wird.",hb:"Blüht jetzt",hp:"Jetzt säen oder pflanzen",sun:"volle Sonne",shade:"Halbschatten ok",ess:"essbar",none:"In diesem Monat nichts. Winterruhe: Töpfe nicht abräumen, in hohlen Stängeln überwintern Wildbienen.",
   rules:["<b>Ungefüllte Blüten.</b> Gefüllte Zuchtformen haben keinen Pollen und keinen Nektar, sehen für Bienen aus wie eine geschlossene Tür.","<b>Kein Pestizid, auch kein „Bio“-Spray.</b> Blattläuse fressen Marienkäfer und Schwebfliegenlarven, wenn man sie lässt.","<b>Nicht alles gleichzeitig.</b> Ziel: von Februar (Krokus) bis Oktober (Efeu, Fetthenne) immer etwas offen.","<b>Erde mager, nicht gedüngt.</b> Wildpflanzen blühen hungrig besser.","<b>Wasserschale mit Steinen.</b> Bienen ertrinken in glatten Schalen, sie brauchen Landeplätze.","<b>Im Herbst stehen lassen.</b> Abgestorbene Stängel sind Winterquartier. Erst im April schneiden.","<b>Ein Nisthilfe-Block</b> mit 3–8 mm Bohrungen in Hartholz, Südseite, unter dem Dach: Mauerbienen ziehen im März ein."],
   foot:'Auswahl nach Bioterra, Pro Natura und Praxis auf dem Berner Balkon (Mittelland, ca. 550 m). Blühmonate sind Richtwerte, ein warmer Frühling verschiebt sie. Keine Garantie für den einzelnen Balkon. Kein Tracking. <a href="https://github.com/richardcervenka111-create/balkon-fuer-bienen">GitHub</a> · MIT',months:["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"]},
 en:{h:"Balcony for bees",s:"20 plants that feed wild bees, bumblebees and butterflies on a Bern balcony. Pick a month: what blooms now, what to sow or plant now.",hb:"Blooming now",hp:"Sow or plant now",sun:"full sun",shade:"part shade ok",ess:"edible",none:"Nothing this month. Winter rest: do not clear the pots, wild bees overwinter in hollow stems.",
   rules:["<b>Single flowers.</b> Double-flowered cultivars have no pollen and no nectar; to a bee they look like a closed door.","<b>No pesticide, not even “organic” spray.</b> Ladybirds and hoverfly larvae eat the aphids if you let them.","<b>Not everything at once.</b> Aim for something open from February (crocus) to October (ivy, stonecrop).","<b>Lean soil, no fertiliser.</b> Wild plants flower better when hungry.","<b>A water dish with stones.</b> Bees drown in smooth dishes; they need landing spots.","<b>Leave it standing in autumn.</b> Dead stems are winter quarters. Cut in April.","<b>A nesting block</b> with 3–8 mm holes in hardwood, south side, under the roof: mason bees move in in March."],
   foot:'Selection after Bioterra, Pro Natura and practice on a Bern balcony (Swiss plateau, about 550 m). Bloom months are guide values; a warm spring shifts them. No guarantee for your particular balcony. No tracking. <a href="https://github.com/richardcervenka111-create/balkon-fuer-bienen">GitHub</a> · MIT',months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]},
 sk:{h:"Balkón pre včely",s:"20 rastlín, ktoré na bernskom balkóne živia divé včely, čmeliaky a motýle. Vyber mesiac: čo teraz kvitne, čo sa teraz seje alebo sadí.",hb:"Kvitne teraz",hp:"Teraz siať alebo sadiť",sun:"plné slnko",shade:"polotieň stačí",ess:"jedlé",none:"V tomto mesiaci nič. Zimný pokoj: kvetináče nevypratávaj, v dutých stonkách zimujú divé včely.",
   rules:["<b>Jednoduché kvety.</b> Plnokveté odrody nemajú peľ ani nektár; pre včelu sú ako zavreté dvere.","<b>Žiadny pesticíd, ani „bio“ sprej.</b> Vošky zjedia lienky a larvy pestríc, keď ich necháš.","<b>Nie všetko naraz.</b> Cieľ: od februára (krokus) do októbra (brečtan, rozchodník) stále niečo otvorené.","<b>Chudobná pôda, bez hnojenia.</b> Divé rastliny kvitnú hladné lepšie.","<b>Miska s vodou a kameňmi.</b> Včely sa v hladkých miskách topia, potrebujú pristávacie plochy.","<b>Na jeseň nechať stáť.</b> Suché stonky sú zimný úkryt. Strihať až v apríli.","<b>Hniezdny blok</b> s otvormi 3–8 mm v tvrdom dreve, južná strana, pod strechou: murárky sa nasťahujú v marci."],
   foot:'Výber podľa Bioterra, Pro Natura a praxe na bernskom balkóne (Mittelland, asi 550 m). Mesiace kvitnutia sú orientačné; teplá jar ich posunie. Bez záruky pre konkrétny balkón. Žiadne sledovanie. <a href="https://github.com/richardcervenka111-create/balkon-fuer-bienen">GitHub</a> · MIT',months:["Jan","Feb","Mar","Apr","Máj","Jún","Júl","Aug","Sep","Okt","Nov","Dec"]}};
let lang="de", m=new Date().getMonth()+1; const now=m;
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name=x=>x[lang==="de"?0:lang==="en"?1:2];
function card(x){ const T=L[lang]; return `<div class="p"><b>${esc(name(x))}</b> <span class="l">${esc(x[3])}</span><div class="d">${esc(x[8])}</div><span class="tag ${x[6]?"sun":"shade"}">${x[6]?T.sun:T.shade}</span>${x[7]?`<span class="tag ess">${T.ess}</span>`:""}<span class="tag">${T.months.filter((_,i)=>x[4].includes(i+1)).join(" ")}</span></div>`; }
function render(){ const T=L[lang]; document.documentElement.lang=lang; document.title=T.h; $("h").textContent=T.h; $("s").textContent=T.s; $("hb").textContent=T.hb; $("hp").textContent=T.hp; $("foot").innerHTML=T.foot;
  const mo=$("months"); mo.innerHTML=""; T.months.forEach((n,i)=>{ const b=document.createElement("button"); b.textContent=n; b.setAttribute("aria-pressed",i+1===m?"true":"false"); if(i+1===now) b.classList.add("now"); b.onclick=()=>{m=i+1; render();}; mo.appendChild(b); });
  const bl=P.filter(x=>x[4].includes(m)), pl=P.filter(x=>x[5].includes(m));
  $("bloom").innerHTML=bl.length?bl.map(card).join(""):`<p style="color:var(--mut)">${esc(T.none)}</p>`;
  $("plant").innerHTML=pl.length?pl.map(card).join(""):`<p style="color:var(--mut)">–</p>`;
  $("rules").innerHTML="<ul>"+T.rules.map(r=>"<li>"+r+"</li>").join("")+"</ul>";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false")); K.stagger($("bloom"));K.stagger($("plant")); }
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l; render();}));
render();
})();
